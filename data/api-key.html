<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurare dispozitiv</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="main-container">
      <div class="container container-config">
        <form action="/save-config">
          <h1>Configurare dispozitiv</h1>
          <div class="form-group">
            <label for="deviceIndex">Device Index</label>
            <input
              type="text"
              name="deviceIndex"
              class="form-control"
              required
              placeholder="ex: ESP32-001"
            />
          </div>
          <div class="form-group">
            <label for="apiKey">API Key</label>
            <input
              type="text"
              name="apiKey"
              class="form-control"
              required
              placeholder="Introduce&#539;i API Key-ul"
            />
          </div>
          <div class="button-row">
            <input type="submit" class="button-connect" value="Salvare" />
            <a id="btn-back" href="/home" class="button-link button-link-back" style="display:none;">&#206;napoi</a>
          </div>
        </form>
      </div>
    </div>
    <script>
      if (new URLSearchParams(window.location.search).get('back') === '1') {
        document.getElementById('btn-back').style.display = 'inline-flex';
      }
    </script>
  </body>
</html>
